# Bina APK pada setiap push ke main, pull request, atau cetusan manual.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Bina & Uji APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Sediakan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sediakan Flutter (stable + cache pub)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Semak versi Flutter
        run: flutter --version

      - name: Dapatkan dependensi
        run: flutter pub get

      - name: Analisis statik
        run: flutter analyze

      - name: Ujian unit
        run: flutter test

      - name: Tentukan versi APK (daripada pubspec, build number = run number)
        id: ver
        run: |
          V=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '"')
          if [ -z "$V" ]; then echo "Gagal baca versi pubspec.yaml"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versi APK: v$V (versionCode/build: ${{ github.run_number }})"

      - name: Bina APK (split per ABI)
        run: flutter build apk --release --split-per-abi --build-name=${{ steps.ver.outputs.version }} --build-number=${{ github.run_number }}

      - name: Bina APK universal
        run: flutter build apk --release --build-name=${{ steps.ver.outputs.version }} --build-number=${{ github.run_number }}

      - name: Sahkan versi APK yang dibina
        run: |
          # versionName mesti sama dengan versi pubspec — bukan nilai statik lama.
          echo "Dibina dengan --build-name=${{ steps.ver.outputs.version }} --build-number=${{ github.run_number }}"
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Susun nama fail APK (mengandungi versi)
        run: |
          V="${{ steps.ver.outputs.version }}"
          B="${{ github.run_number }}"
          mkdir -p apk_out
          cp build/app/outputs/flutter-apk/app-release.apk             apk_out/DiscordMediaSender-v${V}-universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apk_out/DiscordMediaSender-v${V}-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   apk_out/DiscordMediaSender-v${V}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      apk_out/DiscordMediaSender-v${V}-x86_64.apk
          echo "Versi build (versionCode): $B" > apk_out/BUILD_INFO.txt
          ls -la apk_out

      - name: Muat naik artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-v${{ steps.ver.outputs.version }}-b${{ github.run_number }}
          path: apk_out/*
          if-no-files-found: error
          retention-days: 30
