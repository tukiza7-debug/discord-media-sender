# Bina APK pada setiap push ke main, pull request, atau cetusan manual.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Bina & Uji APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Sediakan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sediakan Flutter (stable + cache pub)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Semak versi Flutter
        run: flutter --version

      - name: Dapatkan dependensi
        run: flutter pub get

      - name: Analisis statik
        run: flutter analyze

      - name: Ujian unit
        run: flutter test

      - name: Bina APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Bina APK universal
        run: flutter build apk --release

      - name: Susun nama fail APK
        run: |
          mkdir -p apk_out
          cp build/app/outputs/flutter-apk/app-release.apk           apk_out/DiscordMediaSender-universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apk_out/DiscordMediaSender-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   apk_out/DiscordMediaSender-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      apk_out/DiscordMediaSender-x86_64.apk
          ls -la apk_out

      - name: Muat naik artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: apk_out/*.apk
          if-no-files-found: error
          retention-days: 30
