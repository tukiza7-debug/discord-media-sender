# Release automatik: push tag v* atau cetusan manual dengan input "version".
# Membina APK bertandatangan (atau debug signing jika secrets tiada),
# menjana checksum SHA256 dan mencipta GitHub Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi untuk release (contoh: 1.0.0 atau v1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Bina & Terbitkan Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod (penuh — perlu untuk sejarah tag & commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sediakan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sediakan Flutter (stable + cache pub)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Tentukan nombor versi
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${{ github.ref_name }}"
          fi
          RAW="${RAW#v}"
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "Versi release: $RAW"

      - name: Pastikan versi belum pernah diterbitkan (mesti berubah, jangan sama)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.ver.outputs.version }}"
          if gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $V sudah wujud. Setiap release mesti guna versi baharu — naikkan nombor versi (contoh: v1.0.0 → v1.0.1) dan push tag tersebut."
            exit 1
          fi
          echo "Versi $V belum digunakan — release akan dihasilkan dengan versi ini."

      - name: Selaraskan versi pubspec dengan versi release
        run: |
          V="${{ steps.ver.outputs.version }}"
          sed -i -E "s/^version:.*$/version: ${V}+${{ github.run_number }}/" pubspec.yaml
          grep -E '^version:' pubspec.yaml

      - name: Sediakan keystore daripada secrets (jika ada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          EOF
            echo "Keystore release dikesan - APK akan ditandatangan dengan kunci release."
          else
            echo "Tiada KEYSTORE_BASE64 - build terus dengan debug signing supaya tetap berjaya."
          fi

      - name: Dapatkan dependensi
        run: flutter pub get

      - name: Bina APK split per ABI
        run: flutter build apk --release --split-per-abi --build-name=${{ steps.ver.outputs.version }} --build-number=${{ github.run_number }}

      - name: Bina APK universal
        run: flutter build apk --release --build-name=${{ steps.ver.outputs.version }} --build-number=${{ github.run_number }}

      - name: Namakan fail & jana checksum SHA256
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p release_out
          cp build/app/outputs/flutter-apk/app-release.apk           "release_out/DiscordMediaSender-v${V}-universal.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release_out/DiscordMediaSender-v${V}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "release_out/DiscordMediaSender-v${V}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "release_out/DiscordMediaSender-v${V}-x86_64.apk"
          # Rekod versi eksplisit dalam setiap release.
          printf 'versionName: %s\nversionCode: %s\n' "$V" "${{ github.run_number }}" > release_out/VERSION.txt
          cd release_out
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Deraf nota kemas kini (daripada CHANGELOG — TANPA 'Full Changelog')
        id: notes
        run: |
          V="${{ steps.ver.outputs.version }}"

          # 1) Cuba ambil seksyen versi ini daripada CHANGELOG.md.
          python3 - "$V" > notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          try:
              txt = open('CHANGELOG.md', encoding='utf-8').read()
          except FileNotFoundError:
              txt = ''
          pat = r'^## \[?v?' + re.escape(v) + r'\]?[^\n]*\n(.*?)(?=^## \[?v?[0-9]|\Z)'
          m = re.search(pat, txt, re.M | re.S)
          print(m.group(1).strip() if m else '')
          PY

          # 2) Fallback: senarai commit sejak tag sebelumnya.
          if [ ! -s notes.md ]; then
            PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            {
              echo "## Kemas Kini v$V"
              echo
              if [ -n "$PREV" ]; then
                git log --pretty=format:'- %s (%h)' "$PREV..${GITHUB_REF_NAME}"
              else
                echo '- Rilis awal.'
              fi
            } > notes.md
          fi

          # 3) Garis keselamatan: buang HANYA footer gaya GitHub
          #    ('**Full Changelog**: URL') — sebutan dalam prosa kekal.
          if grep -qi 'full changelog' notes.md; then
            sed -i '/^[[:space:]]*\*\*[Ff]ull [Cc]hangelog\*\*/d' notes.md
          fi

          echo '--- NOTA RELEASE ---'
          cat notes.md
          echo '--------------------'

      - name: Cipta GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Discord Media Sender v${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: release_out/*
          fail_on_unmatched_files: true
