name: discord_media_sender
description: Aplikasi Android untuk menghantar media pukal ke Discord melalui webhook atau bot.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Rangkaian & API Discord
  dio: ^5.9.0
  http_parser: ^4.0.2

  # Pangkalan data & storan
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4

  # Pemprosesan media
  archive: ^3.6.1
  file_picker: ^8.1.7
  flutter_video_thumbnail_plus: ^1.0.7

  # Servis latar belakang & notifikasi
  flutter_foreground_task: ^8.10.0
  permission_handler: ^11.3.1

  # Rekabentuk
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.20
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#5865F2"
  adaptive_icon_foreground: "assets/icon/splash_logo_android12.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#1E1F22"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#1E1F22"
    image: "assets/icon/splash_logo_android12.png"
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
