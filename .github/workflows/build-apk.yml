# Bina APK pada setiap push ke main, pull request, atau cetusan manual.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Bina & Uji APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Sediakan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sediakan Flutter (stable + cache pub)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # B08: lalui wrapper sebenar ialah android/gradle/wrapper/…
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Semak versi Flutter
        run: flutter --version

      - name: Dapatkan dependensi
        run: flutter pub get

      - name: Analisis statik
        run: flutter analyze

      - name: Ujian unit
        run: flutter test

      - name: Tentukan versi APK (daripada pubspec, build number = run number)
        id: ver
        run: |
          V=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '"')
          if [ -z "$V" ]; then echo "Gagal baca versi pubspec.yaml"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versi APK: v$V (versionCode/build: ${{ github.run_number }})"

      - name: Sediakan keystore stabil daripada secrets (tandatangan konsisten merentas build)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          EOF
            echo "Keystore stabil dikesan - APK akan ditandatangani dengan kunci release tetap."
          else
            echo "Tiada KEYSTORE_BASE64 - build terus dengan debug signing (tandatangan TIDAK stabil)."
          fi

      - name: Bina APK (split per ABI)
        run: flutter build apk --release --split-per-abi --build-name=${{ steps.ver.outputs.version }} --build-number=${{ github.run_number }}

      - name: Bina APK universal
        run: flutter build apk --release --build-name=${{ steps.ver.outputs.version }} --build-number=${{ github.run_number }}

      - name: Sahkan versi APK yang dibina
        run: |
          # versionName mesti sama dengan versi pubspec — bukan nilai statik lama.
          echo "Dibina dengan --build-name=${{ steps.ver.outputs.version }} --build-number=${{ github.run_number }}"
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Audit tandatangan & versi APK (rekod untuk rujukan)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          {
            echo "== Sijil tandatangan (apksigner) =="
            "$APKSIGNER" verify --print-certs "$APK" | grep -E 'certificate SHA-256|certificate DN' || true
            echo "== Versi APK (aapt2 dump badging) =="
            "$AAPT" dump badging "$APK" | grep -E '^package:' || true
            echo "SHA256 sijil mesti SAMA merentas release supaya kemas kini boleh dipasang terus."
          } | tee apk_signing_audit.txt

      - name: Susun nama fail APK (mengandungi versi)
        run: |
          V="${{ steps.ver.outputs.version }}"
          B="${{ github.run_number }}"
          mkdir -p apk_out
          cp build/app/outputs/flutter-apk/app-release.apk             apk_out/DiscordMediaSender-v${V}-universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apk_out/DiscordMediaSender-v${V}-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   apk_out/DiscordMediaSender-v${V}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      apk_out/DiscordMediaSender-v${V}-x86_64.apk
          {
            echo "Versi build (versionCode): $B"
            # B08: label jelas — build dev/PR ini mungkin debug-signed.
            if grep -q "debug signing" apk_signing_audit.txt 2>/dev/null || ! grep -q "certificate SHA-256" apk_signing_audit.txt 2>/dev/null; then
              echo "Signing: debug-signed (dev build - JANGAN edarkan)"
            else
              echo "Signing: release key (stabil)"
            fi
            cat apk_signing_audit.txt
          } > apk_out/BUILD_INFO.txt
          ls -la apk_out

      - name: Muat naik artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-v${{ steps.ver.outputs.version }}-b${{ github.run_number }}
          path: apk_out/*
          if-no-files-found: error
          retention-days: 30
